name: build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  NDK_VERSION: 27.2.12479018
  MIN_SDK_VERSION: 21

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        abi: [armeabi-v7a, arm64-v8a, x86, x86_64]

    steps:
      - uses: actions/checkout@v4

      - name: Install NDK
        run: |
          yes | sdkmanager --install "ndk;${{ env.NDK_VERSION }}" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${{ env.NDK_VERSION }}" >> $GITHUB_ENV

      - name: Build with CMake
        run: |
          cmake \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-${{ env.MIN_SDK_VERSION }} \
            -DANDROID_ARM_NEON=TRUE \
            -DCMAKE_BUILD_TYPE=Release \
            .
          cmake --build . -- -j$(nproc)
          mv libv4a_re.so libv4a_re_${{ matrix.abi }}.so

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-binaries-${{ matrix.abi }}
          path: libv4a_re_${{ matrix.abi }}.so
          if-no-files-found: error

  package:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all compiled libraries
        uses: actions/download-artifact@v4
        with:
          pattern: compiled-binaries-*
          path: compiled/
          merge-multiple: true

      - name: Prepare and zip module
        run: |
          mkdir -p module/common/files
          cp compiled/libv4a_re_*.so module/common/files/
          cd module
          zip -r9 ../ViPER4Android_Module.zip *

      - name: Upload module zip
        uses: actions/upload-artifact@v4
        with:
          name: ViPER4Android_Module
          path: ViPER4Android_Module.zip
          if-no-files-found: error
          retention-days: 30
